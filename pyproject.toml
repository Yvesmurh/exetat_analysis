[project]
name = "exetat-analysis"
version = "0.1.0"
description = "Exetat performance Analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.2",
    "uvicorn>=0.35.0",
    "pdfplumber==0.11.7",
    "pandas>=2.2",
    "mysql-connector-python>=9.0",
    "requests>=2.34.2",
    "dash[cloud]>=2.17",
    "plotly>=5.22",
    "python-dotenv>=1.0",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.1",
    "d>=0.2.2",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "pytest>=8.4.2",
    "ruff>=0.13.1"
]

# in order to configuring the project i have to set the project's entry-point script 
# and this is it .
[project.scripts]
exetat-analysis = "main:main"

# this say that to build a system i will need a setuptools and wheel s
[build-system]
requires = ["setuptools>=78.1.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"
